name: Deploy Prod

# Prod ships only when you publish a GitHub Release (tag vX.Y.Z).
# The release IS the deliberate confirmation — no per-merge prompts.
on:
  release:
    types: [published]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  deploy-prod:
    runs-on: ubuntu-latest
    needs: typecheck
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Prod build-args are intentionally hardcoded (not env-scoped vars): a missing
      # prod variable would silently fall back to repo-level dev values and bake the
      # wrong booking domain into the production bundle. These are public domains.
      - name: Build and push prod image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository }}:prod
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_BOOKING_SITE_DOMAIN=site.veinticuatro7.app

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH_ADMIN }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_REPOSITORY
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH_ADMIN }}"
            cd "$DEPLOY_PATH"

            # Login to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u avirgili-eclub --password-stdin

            # Keep the currently running image as rollback target
            docker tag ghcr.io/$GITHUB_REPOSITORY:prod-current ghcr.io/$GITHUB_REPOSITORY:prod-previous 2>/dev/null || true

            # Pull the new prod image and promote it to prod-current (used by the compose)
            docker pull ghcr.io/$GITHUB_REPOSITORY:prod
            docker tag ghcr.io/$GITHUB_REPOSITORY:prod ghcr.io/$GITHUB_REPOSITORY:prod-current

            # Full rollout: creates the service on first run, recreates only what changed after
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            # Health check (60 attempts, 2s apart = 120s max)
            echo "Waiting for prod frontend to be healthy..."
            for i in $(seq 1 60); do
              if docker exec agendateya-admin-prod wget --no-verbose --tries=1 --spider http://127.0.0.1/health 2>/dev/null; then
                echo "Prod frontend is healthy!"
                exit 0
              fi
              echo "Attempt $i/60..."
              sleep 2
            done

            echo "Health check failed! Rolling back to previous image..."
            docker logs agendateya-admin-prod --tail 200 || true
            docker tag ghcr.io/$GITHUB_REPOSITORY:prod-previous ghcr.io/$GITHUB_REPOSITORY:prod-current || true
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps agendateya-admin
            exit 1
